# Build the recipe-opt agent Docker image and push to Amazon ECR.
# Trigger: pushes to `deployment` only (not main — add main later when ready).
#
# Required GitHub repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Uses us-east-1 / ECR repo macroiq (matches push_mvp_ecr.sh).
# Cost note: builds/pushes an image only — no EC2, ECS, or App Runner.
name: Push agent image to ECR

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match teammate ECR setup; override via repo Variables if needed.
  AWS_REGION: us-east-1
  ECR_REPO: macroiq

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          ACCOUNT_ID="${{ steps.ecr-login.outputs.registry }}"
          ACCOUNT_ID="${ACCOUNT_ID%%.*}"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPO }}" \
            --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPO }}" \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image_uri }}:deployment
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### ECR push complete"
            echo ""
            echo "- Repository: \`${{ env.ECR_REPO }}\`"
            echo "- Region: \`${{ env.AWS_REGION }}\`"
            echo "- Tags:"
            echo "  - \`${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "  - \`${{ steps.meta.outputs.image_uri }}:deployment\`"
          } >> "$GITHUB_STEP_SUMMARY"
